<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tiến độ của bé · Little Seed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap">
<script src="../assets/lc-track.js"></script>
<style>
[hidden]{display:none!important}
:root{color-scheme:light;--bg:#FFF7E8;--card:#fff;--soft:#FBF3E4;--line:#EAD7B8;--ink:#2F241B;--ink2:#6B5848;--leaf:#3F8A46;--sun:#FFC94A;
 --good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--bar:#2a78d6;--on:#CFE3FB;
 --fd:"Baloo 2","Nunito",system-ui,sans-serif;--fb:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1B1713;--card:#26201A;--soft:#2E271F;--line:#463A2E;--ink:#F3E9DA;--ink2:#C9B8A2;--leaf:#5FA864;--bar:#3987e5;--on:#1c4a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45}
a{color:inherit}:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
.hero{text-align:center;display:grid;gap:2px;justify-items:center}
.hero img{width:70px}.hero h1{margin:0;font-family:var(--fd);font-weight:800;font-size:clamp(28px,7vw,42px);line-height:1.05}
.hero p{margin:0;color:var(--ink2);font-weight:700;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.kpi b{display:block;font-family:var(--fd);font-weight:800;font-size:28px;line-height:1.1}.kpi span{color:var(--ink2);font-weight:700;font-size:13px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px}
.card h2{margin:0 0 8px;font-family:var(--fd);font-weight:800;font-size:21px}
.units{display:grid;gap:10px}
details.u{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
details.u>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--soft)}
details.u>summary::-webkit-details-marker{display:none}
.un{width:38px;height:38px;border-radius:12px;background:var(--leaf);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:20px}
.ut b{display:block;font-weight:800}.ut small{color:var(--ink2);font-weight:700}
.dots{display:flex;gap:5px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--bar)}
.in{padding:10px 12px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:start;font-size:14px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.sn{font-weight:800}.sn small{display:block;color:var(--ink2);font-weight:700}
.g{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
.g:last-child{border:0}
.sc{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.sc::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--d,transparent)}
.sc.good{--d:var(--good)}.sc.warn{--d:var(--warn)}.sc.crit{--d:var(--crit)}
.rec{display:grid;gap:6px;font-size:14px}.rec div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.muted{color:var(--ink2);font-weight:700}
.note{background:var(--soft);border:2px dashed var(--line);border-radius:14px;padding:12px;font-weight:700;color:var(--ink2);text-align:center}
.chart svg{display:block;width:100%;height:auto}.ax{fill:var(--ink2);font-size:11px;font-weight:700}.grid{stroke:var(--line);stroke-width:1}.bar{fill:var(--bar)}
</style>
</head>
<body>
<main class="wrap">
  <nav class="nav"><a class="btn" href="../hoc/">‹ Tất cả Unit</a><button class="btn" id="reload" type="button">↻ Tải lại</button></nav>
  <header class="hero"><img src="../assets/leo.webp" alt=""><h1 id="who">Tiến độ của bé</h1><p id="meta">Đang tải…</p></header>
  <div id="body"></div>
</main>
<script>
"use strict";
const $=s=>document.querySelector(s), esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const UNITS=[null,"Greetings · Chào hỏi","Name & Age · Tên và tuổi","My Family · Gia đình","My Body · Cơ thể","Feelings · Cảm xúc","My School · Trường học","My Home · Đồ đạc trong nhà","Animals & Actions · Động vật","Food & Drink · Đồ ăn, đồ uống","Weather · Thời tiết","Colors · Màu sắc","Counting · Số đếm"];
const SAT=[3,4,6,7,8], SECS=["Warm-up","Vocab Bài 1","Vocab Bài 2","Story","Practice","Show and Tell"];
const secsOf=u=>SAT.includes(u)?SECS:SECS.slice(0,5);
const TZ="Asia/Ho_Chi_Minh";
const fT=d=>d.toLocaleString("vi-VN",{timeZone:TZ,hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"});
const mins=s=>s>=3600?(s/3600).toFixed(1).replace(".",",")+" giờ":s>=60?Math.round(s/60)+" phút":Math.round(s)+" giây";
const band=p=>p>=80?"good":p>=50?"warn":"crit";
const dk=d=>d.toLocaleDateString("en-CA",{timeZone:TZ});
const API=(window.LC&&LC.api)||"";
function user(){return window.LC?LC.user():null}
function load(){
  const u=user();
  if(!u){$("#meta").textContent="Bố mẹ đăng nhập ở cửa sổ hiện ra nhé.";return}
  $("#who").textContent="Tiến độ của bé "+u.name; $("#meta").textContent="Đang tải…";
  if(!API){$("#body").innerHTML='<div class="note">Web chưa nối Google Sheet.</div>';return}
  fetch(API+"?action=kid&id="+encodeURIComponent(u.id)).then(r=>r.json()).then(j=>{
    if(!j.ok)throw new Error(j.error||"lỗi");
    if(!Array.isArray(j.events))throw new Error("máy chủ Google Sheet chưa được cập nhật bản mới");
    draw(j,u);
  }).catch(e=>{$("#meta").textContent="";$("#body").innerHTML='<div class="note">Chưa tải được tiến độ ('+esc(e.message)+'). Bố mẹ kiểm tra mạng rồi bấm "Tải lại" nhé.</div>'});
}
function draw(j,u){
  const ev=j.events.map(r=>({t:new Date(r[0]),unit:+r[3]||0,sec:String(r[4]||""),type:String(r[5]||""),game:String(r[6]||""),score:r[7]===""?null:+r[7],total:r[8]===""?null:+r[8],pct:r[9]===""?null:+r[9],secs:+r[10]||0}));
  $("#who").textContent="Tiến độ của bé "+(j.name||u.name);
  if(!ev.length){$("#meta").textContent="";$("#body").innerHTML='<div class="note">Bé chưa có hoạt động nào. Bé vào học một bài, chơi xong một trò thì kết quả sẽ hiện ở đây nhé.</div>';return}
  const last=ev.reduce((a,e)=>e.t>a?e.t:a,ev[0].t);
  $("#meta").textContent="Học gần nhất: "+fT(last)+(j.lop?" · Lớp "+j.lop:"");
  const total=ev.reduce((a,e)=>a+e.secs,0), sc=ev.filter(e=>e.type==="Điểm"&&e.total);
  const days=new Set(ev.map(e=>dk(e.t))).size;
  const best={}; sc.forEach(e=>{const k=e.unit+"|"+e.sec+"|"+e.game,b=best[k]||(best[k]={unit:e.unit,sec:e.sec,game:e.game,n:0,top:e,last:e});b.n++;if(e.pct>b.top.pct)b.top=e;if(e.t>b.last.t)b.last=e});
  const bs=Object.values(best), avg=bs.length?bs.reduce((a,b)=>a+b.top.pct,0)/bs.length:null;
  const vids=ev.filter(e=>e.type==="Video").length;
  let h='<section class="kpis">'+[[days,"Ngày đã học"],[mins(total),"Thời gian học"],[bs.length,"Trò đã chơi có điểm"],[avg==null?"—":Math.round(avg)+"%","Điểm trung bình"],[vids,"Video bé đã quay"]].map(x=>'<div class="kpi"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join("")+'</section>';
  // 14 ngày
  const dd=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*864e5);dd.push({k:dk(d),d,v:0})}
  const ix=Object.fromEntries(dd.map((x,i)=>[x.k,i]));ev.forEach(e=>{const i=ix[dk(e.t)];if(i!=null)dd[i].v+=e.secs/60});
  const W=700,H=150,L=30,B=22,T=8,mx=Math.max(5,...dd.map(x=>x.v)),top=Math.ceil(mx/5)*5,y=v=>T+(H-T-B)*(1-v/top),bw=(W-L)/14;
  let g="";for(let v=0;v<=top;v+=top/ (top>=20?4:top/5||1)){g+='<line class="grid" x1="'+L+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(L-5)+'" y="'+(y(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>'}
  dd.forEach((x,i)=>{const cx=L+bw*i+bw/2,w=Math.min(26,bw*.55);if(x.v>0)g+='<rect class="bar" rx="4" x="'+(cx-w/2)+'" y="'+y(x.v)+'" width="'+w+'" height="'+(H-B-y(x.v))+'"><title>'+Math.round(x.v)+' phút</title></rect>';if(i%2)g+='<text class="ax" x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+x.d.toLocaleDateString("vi-VN",{timeZone:TZ,day:"2-digit",month:"2-digit"})+'</text>'});
  h+='<section class="card chart"><h2>Số phút học mỗi ngày (14 ngày)</h2><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Số phút học mỗi ngày">'+g+'</svg></section>';
  // theo unit
  h+='<section class="card"><h2>Từng Unit</h2><div class="units">';
  const opened={};ev.forEach(e=>{if(e.unit&&e.sec)(opened[e.unit]=opened[e.unit]||{})[e.sec]=1});
  for(let u=1;u<=12;u++){
    const need=secsOf(u),op=opened[u]||{},n=need.filter(s=>op[s]).length;
    const gs=bs.filter(b=>b.unit===u), ua=gs.length?gs.reduce((a,b)=>a+b.top.pct,0)/gs.length:null;
    h+='<details class="u"'+(n&&u===Math.max(...Object.keys(opened).map(Number))?" open":"")+'><summary><span class="un">'+u+'</span><span class="ut"><b>'+esc(UNITS[u])+'</b><small>'+(n?n+"/"+need.length+" mục đã học":"Chưa học")+(ua!=null?" · điểm TB "+Math.round(ua)+"%":"")+'</small></span><span class="dots">'+need.map(s=>'<i class="'+(op[s]?"on":"")+'" title="'+s+'"></i>').join("")+'</span></summary><div class="in">';
    if(!n)h+='<span class="muted">Bé chưa học Unit này.</span>';
    need.forEach(s=>{const rows=gs.filter(b=>b.sec===s).sort((a,b)=>a.game.localeCompare(b.game));
      h+='<div class="row"><div class="sn">'+(op[s]?"✓ ":"— ")+s+'<small>'+(op[s]?"đã học":"chưa học")+'</small></div><div>'+(rows.length?rows.map(b=>'<div class="g"><span>'+esc(b.game)+' <span class="muted">· '+b.n+' lượt</span></span><span class="sc '+band(b.top.pct)+'" title="Lần gần nhất: '+b.last.score+'/'+b.last.total+'">'+b.top.score+'/'+b.top.total+'</span></div>').join(""):'<span class="muted">'+(op[s]?"Chưa có điểm":"")+'</span>')+'</div></div>'});
    h+='</div></details>'}
  h+='</div><p class="muted" style="font-size:13px;margin:8px 0 0">Điểm hiện là kết quả <b>cao nhất</b> của bé ở mỗi trò. <span class="sc good">từ 80%</span> <span class="sc warn">50–79%</span> <span class="sc crit">dưới 50%</span></p></section>';
  // gần đây
  const rec=ev.filter(e=>e.type==="Điểm"||e.type==="Video").sort((a,b)=>b.t-a.t).slice(0,12);
  if(rec.length)h+='<section class="card"><h2>Hoạt động gần đây</h2><div class="rec">'+rec.map(e=>'<div><span>'+fT(e.t)+' · U'+e.unit+' · '+esc(e.game||e.sec)+'</span>'+(e.type==="Điểm"?'<span class="sc '+band(e.pct)+'">'+e.score+'/'+e.total+'</span>':'<span>🎥 '+e.secs+' giây</span>')+'</div>').join("")+'</div></section>';
  $("#body").innerHTML=h;
}
$("#reload").addEventListener("click",load);
window.addEventListener("load",()=>setTimeout(load,60));
</script>
</body>
</html>
