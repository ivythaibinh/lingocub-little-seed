<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nông trại của bé · Lingo Cub</title>
<meta name="theme-color" content="#a8652f">
<link rel="icon" href="../assets/pixel/sun.png">
<link rel="stylesheet" href="../assets/pixel/pixel.css">
<script src="../assets/lc-track.js"></script>
<style>
  body{background:#6fbf5b;padding-bottom:40px;font-size:22px}
  .ic{vertical-align:-4px}
  /* thanh trên */
  .top{display:flex;align-items:center;gap:14px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));color:#fff;flex-wrap:wrap;
    background:repeating-linear-gradient(0deg,#a8652f 0 16px,#93562a 16px 20px);border-bottom:6px solid var(--ink)}
  .back{background:var(--blue);font-size:24px;padding:4px 12px}
  .top .lg{height:52px;width:auto}
  .top h1{margin:0;font-size:clamp(26px,3.2vw,40px);font-weight:400;letter-spacing:1px;text-shadow:3px 3px 0 var(--ink);flex:1;min-width:200px;text-transform:uppercase}
  .lvl{padding:4px 12px 6px;color:var(--ink);font-size:20px;width:280px;cursor:pointer}
  .lvl b{font-size:26px;font-weight:400}
  .bar{height:14px;background:#e3d3b0;margin-top:3px;position:relative;box-shadow:0 -2px 0 var(--ink),0 2px 0 var(--ink),-2px 0 0 var(--ink),2px 0 0 var(--ink)}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
  .stars{background:var(--yellow);font-size:36px;padding:2px 14px;display:flex;align-items:center;gap:6px;color:var(--ink)}
  .wrap{max-width:1320px;margin:0 auto;padding:22px 18px 0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px}
  .wrap2{max-width:1320px;margin:0 auto;padding:26px 18px 0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:26px;align-items:start}
  .pxf h2{margin:0;font-size:28px;font-weight:400;display:flex;align-items:center;gap:8px}
  .pxf h2 .r{margin-left:auto;font-size:22px;color:var(--mute)}
  /* lịch */
  .cal{padding:12px 14px 14px}
  .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:10px}
  .d{background:var(--paper);text-align:center;padding:6px 2px;position:relative;cursor:pointer;box-shadow:0 -2px 0 var(--ink),0 2px 0 var(--ink),-2px 0 0 var(--ink),2px 0 0 var(--ink)}
  .d .n{font-size:22px;line-height:1}.d .n small{color:var(--mute);font-size:18px}
  .d .w{display:flex;justify-content:center;margin:4px 0 2px;min-height:52px;align-items:center}
  .d .s{font-size:20px;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:2px;min-height:24px}
  .d.today{background:#fff3a8;box-shadow:0 -4px 0 var(--orange-d),0 4px 0 var(--orange-d),-4px 0 0 var(--orange-d),4px 0 0 var(--orange-d)}
  .d.today .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;font-size:16px;padding:0 6px;box-shadow:0 0 0 2px var(--ink);white-space:nowrap}
  .d.fut{background:#eef6ff}.d.unk{background:#e9e2d3;color:var(--mute)}
  .d .drop{position:absolute;right:3px;top:3px}
  .wk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:21px;flex-wrap:wrap}
  .pips{display:flex;gap:5px}.pips i{width:18px;height:18px;background:#e3d3b0;box-shadow:0 0 0 2px var(--ink)}.pips i.on{background:var(--green)}
  .rw{display:flex;align-items:center;gap:4px;padding:0 8px;background:#fff;box-shadow:0 0 0 2px var(--ink);font-size:20px;border:0;cursor:default}
  .rw.can{background:#d9f7d2;cursor:pointer;animation:bob 1s infinite}
  .rw.got{opacity:.6}
  @keyframes bob{50%{transform:translateY(-2px)}}
  /* cây lớp */
  .cls{padding:12px 14px}
  .cls .tree{display:flex;gap:10px;align-items:center;margin-top:4px}
  .cls .row{font-size:20px;margin-top:2px;white-space:nowrap}
  .cls .row .bar{height:12px;margin:3px 0 8px}
  .cls .ft{font-size:19px;color:var(--mute);margin-top:4px;line-height:1.1}
  .cls .claim{margin-top:8px;font-size:22px;padding:4px 12px;background:var(--orange)}
  /* bản tin */
  .news{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:8px 16px;background:#e6f3ff;flex-wrap:wrap}
  .news .mc{height:118px;width:auto;flex:none;margin:-6px 0}
  .bub{flex:1;min-width:260px;background:#fff;padding:8px 14px;position:relative;box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink)}
  .bub .en{font-size:32px;line-height:1.1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bub .zhl{font-size:24px;display:flex;align-items:center;gap:10px;margin-top:2px;flex-wrap:wrap}
  .py{font-family:'VT323';font-size:22px;color:var(--blue-d);font-weight:400}
  .spk{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;background:var(--yellow);border:0;box-shadow:0 0 0 2px var(--ink);cursor:pointer;flex:none}
  .spk.on{background:#ffb13b}
  .bub .vi{font-size:22px;color:#335;margin-top:4px}
  .act{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:260px}
  .act .btn{font-size:24px;justify-content:center;background:var(--blue)}
  .need{font-size:19px;display:flex;flex-wrap:wrap;gap:6px}
  .need span{display:flex;align-items:center;gap:3px;background:#fff;padding:0 6px;box-shadow:0 0 0 2px var(--ink)}
  .need .ok{background:#d9f7d2}.need .no{background:#ffe0dc}
  .tmr{font-size:19px;color:#345;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  /* nông trại */
  .farmbox{padding:8px;background:#3b2416}
  .stage{line-height:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sc{position:relative}
  .sc canvas{width:100%;height:auto;display:block;cursor:pointer}
  @media (max-width:760px){.sc{min-width:720px}.stage::after{content:"";display:block}}
  .tagc{position:absolute;transform:translate(-50%,-50%);font-size:clamp(13px,1.5vw,19px);line-height:1.2;padding:0 5px;background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--ink);display:flex;align-items:center;gap:3px;white-space:nowrap;pointer-events:none}
  .tagc.warn{background:#ffe0dc}.tagc.good{background:#d9f7d2}
  .tools{display:flex;flex-wrap:wrap;gap:12px;padding:12px 4px 4px;align-items:center}
  .tools .btn{font-size:22px;padding:4px 12px}
  .tools .info{color:#f5e6c8;font-size:20px;margin-left:auto}
  /* khu đổi sao */
  .shop{padding:12px 12px 14px}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;margin:10px 0 14px}
  .tab{font-size:20px;padding:2px 6px;background:#fff;display:flex;align-items:center;gap:4px;white-space:nowrap;border:0;cursor:pointer;box-shadow:0 0 0 2px var(--ink)}
  .tab.on{background:var(--orange);color:#fff;text-shadow:1px 1px 0 var(--ink)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .it{background:var(--paper);display:grid;grid-template-columns:52px minmax(0,1fr);gap:0 8px;padding:6px 8px;align-items:center;cursor:pointer;
    box-shadow:0 -2px 0 var(--ink),0 2px 0 var(--ink),-2px 0 0 var(--ink),2px 0 0 var(--ink)}
  .it>.pic{grid-row:1/3;display:grid;place-items:center;min-height:52px}
  .it .nm{font-size:23px;line-height:1}
  .it .sub{font-size:16px;color:var(--mute);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .pr{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
  .price{display:inline-flex;align-items:center;gap:2px;font-size:21px;padding:0 6px;background:var(--yellow);box-shadow:0 0 0 2px var(--ink)}
  .own{font-size:17px;color:var(--green-d)}
  .buy{font-size:20px;padding:0 10px;--b:2px}
  .it.lock{background:#ece4d6}.it.lock .pic{filter:grayscale(.85);opacity:.7}
  .lk{font-size:17px;color:var(--mute);display:flex;align-items:center;gap:2px}
  .hint{margin-top:10px;font-size:19px;color:var(--mute);line-height:1.15}
  /* thẻ thông tin + kho */
  .ov{position:fixed;inset:0;z-index:50;background:rgba(46,34,56,.45);display:grid;place-items:center;padding:16px}
  .card{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:12px 16px 16px;background:var(--paper)}
  .card .hd{display:flex;align-items:center;gap:12px}
  .card .hd .x{margin-left:auto;align-self:flex-start;font-size:26px;border:0;background:none;cursor:pointer;color:var(--mute)}
  .card .hd .st{font-size:21px;color:var(--green-d);line-height:1.1}
  .card .l{display:flex;align-items:center;gap:8px;font-size:32px;line-height:1.15;flex-wrap:wrap}
  .card .l.z{font-size:28px}.card .l.v{font-size:26px;color:#555}
  .card .lb{font-size:17px;color:var(--mute);width:26px}
  .card .note{font-size:20px;color:#555;margin:8px 0 0;line-height:1.15}
  .card .acts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .card .acts .btn{justify-content:center;font-size:25px}
  .card .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .card .opt{display:flex;align-items:center;gap:6px;background:#fff;border:0;padding:4px 8px;font-size:20px;cursor:pointer;box-shadow:0 0 0 2px var(--ink);text-align:left}
  .card h3{margin:14px 0 6px;font-size:24px;font-weight:400}
  .kho{display:grid;grid-template-columns:1fr;gap:8px}
  .kr{display:flex;align-items:center;gap:8px;background:#fff;padding:3px 8px;box-shadow:0 0 0 2px var(--ink);font-size:21px}
  .kr .q{margin-left:auto;margin-right:6px}
  .kr .btn{font-size:19px;padding:0 8px;--b:2px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-size:24px;padding:8px 16px;max-width:92vw;text-align:center;box-shadow:0 0 0 3px #fff;pointer-events:none;transition:opacity .3s}
  .toast.bad{background:#a33a2e}
  .boom{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(46,34,56,.55)}
  .boom .pxf{padding:18px 26px;text-align:center;font-size:30px}
  .boom .pxf b{display:block;font-size:46px;font-weight:400;color:var(--orange-d)}
  @media (max-width:1100px){.wrap2{grid-template-columns:minmax(0,1fr)}.shop{order:2}}
  @media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.act{width:100%}.news .mc{height:90px}}
  @media (max-width:560px){
    body{font-size:20px}.days{gap:5px}.d .n small{display:none}.d .s{font-size:17px}
    .grid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.top .lg{display:none}.lvl{width:100%}
    .bub .en{font-size:26px}.tools .info{margin-left:0}
  }
</style>
</head>
<body>
<header class="top">
  <a class="btn back" href="../">◀ Trang chủ</a>
  <img class="lg" src="../assets/pixel/logo.webp" alt="Lingo Cub">
  <h1 id="title">Nông trại của bé</h1>
  <div class="lvl pxf" id="lvl"></div>
  <div class="stars pxf" id="stars"></div>
</header>

<div class="wrap">
  <section class="cal pxf">
    <h2><span id="calIc"></span>Lịch tuần này<span class="r" id="calRange"></span></h2>
    <div class="days" id="days"></div>
    <div class="wk" id="wk"></div>
  </section>
  <section class="cls pxf" id="cls"></section>
  <section class="news pxf" id="news"></section>
</div>

<div class="wrap2">
  <section>
    <div class="farmbox pxf">
      <div class="stage"><div class="sc" id="stage"><canvas id="fc" class="px"></canvas></div></div>
      <div class="tools" id="tools"></div>
    </div>
  </section>
  <section class="shop pxf">
    <h2><span id="shopIc"></span>Khu đổi sao<span class="r" id="shopStars" style="color:var(--ink);display:flex;align-items:center;gap:2px"></span></h2>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
    <div class="hint" id="hint"></div>
  </section>
</div>

<script src="img/atlas.js"></script>
<script src="../assets/pixel/px.js"></script>
<script src="data.js"></script>
<script src="farm-core.js"></script>
<script src="farm-ui.js"></script>
</body>
</html>
