<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lingo Cub · Little Seed</title>
<meta name="theme-color" content="#6cc4ff">
<link rel="icon" href="assets/pixel/sun.png">
<link rel="stylesheet" href="assets/pixel/pixel.css">
<script src="assets/lc-track.js" data-chip="off"></script>
<style>
  html,body{height:100%}
  body{min-height:100vh;min-height:100dvh;overflow-x:hidden;position:relative;background:#6cc4ff}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  .page{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px 0}
  /* hàng đầu: mặt trời · logo · bé — cao bằng nhau */
  .toprow{--h:clamp(54px,9vh,76px);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sun{height:var(--h);width:auto}
  .logo{height:var(--h);width:auto}
  .kid{height:var(--h);min-width:calc(var(--h)*1.4);padding:3px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;border:0;font-family:inherit}
  .kid img{height:calc(var(--h)*.4);width:auto}
  .kid b{font-size:calc(var(--h)*.27);font-weight:400;line-height:1;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kid .sw{font-size:calc(var(--h)*.2);line-height:1.2;color:#fff;background:var(--blue);padding:0 8px;box-shadow:0 0 0 2px var(--ink)}
  /* trời: Little Seed + 2 nút */
  .mid{flex:0 0 auto;height:calc(75vh - var(--top,100px));height:calc(75dvh - var(--top,100px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,5vh,54px);padding:10px 0 18px}
  .seed{display:flex;align-items:center;gap:clamp(6px,1.4vw,16px)}
  .seed h1{margin:0;font-size:clamp(34px,7.2vw,84px);line-height:1;color:var(--yellow);letter-spacing:.04em;white-space:nowrap;
    text-shadow:-.06em 0 0 var(--ink),.06em 0 0 var(--ink),0 -.06em 0 var(--ink),0 .06em 0 var(--ink),-.06em -.06em 0 var(--ink),.06em .06em 0 var(--ink),-.06em .06em 0 var(--ink),.06em -.06em 0 var(--ink),0 .14em 0 rgba(46,34,56,.35)}
  .seed .pxi{transform:scale(var(--k,1))}
  .btns{display:flex;gap:clamp(18px,4vw,56px);flex-wrap:wrap;justify-content:center;width:100%}
  .big{width:min(420px,44vw);min-height:clamp(118px,19vh,170px);padding:8px 22px 8px 14px;font-size:clamp(34px,4.6vw,60px);line-height:.9;justify-content:flex-start;gap:14px}
  .big .t{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left}
  .big small{font-size:.5em}
  .b1{background:var(--orange)}
  .b1 img{height:clamp(96px,16vh,150px);width:auto;margin-top:-18px;filter:drop-shadow(0 4px 0 rgba(46,34,56,.3))}
  .b2{background:var(--green)}
  .b2 .chip{font-size:.46em;text-shadow:none}
  @media (max-width:640px){
    .btns{flex-direction:column;align-items:center}
    .big{width:min(360px,92vw)}
    .mid{height:auto;min-height:calc(75dvh - var(--top,100px))}
  }
  .foot{position:fixed;right:10px;bottom:6px;z-index:2;font-size:18px;display:flex;gap:12px}
  .foot a{color:#fff;text-shadow:1px 1px 0 var(--ink);text-decoration:none;background:rgba(46,34,56,.45);padding:0 6px}
</style>
</head>
<body>
<canvas id="bg" class="px" aria-hidden="true"></canvas>
<div class="page">
  <div class="toprow" id="top">
    <img class="sun px" src="assets/pixel/sun.png" alt="">
    <img class="logo" src="assets/pixel/logo.webp" alt="Lingo Cub · English and Chinese Hub">
    <button class="kid pxf" id="kid" type="button" title="Đổi bé đang học"><img class="px" src="assets/pixel/panda.png" alt=""><b id="kidName">Bé</b><span class="sw">Đổi bé</span></button>
  </div>
  <div class="mid">
    <div class="seed" id="seed"><span id="sp1"></span><h1 class="title">LITTLE SEED</h1><span id="sp2" style="transform:scaleX(-1);display:inline-block"></span></div>
    <div class="btns">
      <a class="btn big b1" href="hoc/"><img src="assets/pixel/buffalo-book.webp" alt=""><span class="t">VÀO HỌC<small>Làm bài tập để tích sao</small></span></a>
      <a class="btn big b2" href="nong-trai/"><span id="sf"></span><span class="t">NÔNG TRẠI<br>CỦA BÉ<span class="chip" id="starChip"><span id="stIc"></span><b id="stars" style="font-weight:400">0</b> sao</span></span></a>
    </div>
  </div>
</div>
<nav class="foot"><a href="tien-do/">Tiến độ của bé</a><a href="giao-vien/">Trang giáo viên</a></nav>

<script src="assets/lc-music.js"></script>
<script src="nong-trai/img/atlas.js"></script>
<script src="assets/pixel/px.js"></script>
<script src="nong-trai/data.js"></script>
<script src="nong-trai/farm-core.js"></script>
<script>
(function () {
  var u = window.LC && LC.user();
  document.getElementById("kid").onclick = function () { if (window.LC) LC.login(); };
  if (u) document.getElementById("kidName").textContent = u.name;

  function setTop() { var t = document.getElementById("top"); document.documentElement.style.setProperty("--top", (t.offsetHeight + 16) + "px"); }
  var S = 4, cv = document.getElementById("bg");
  function scene() {
    S = innerWidth < 700 ? 2 : innerWidth < 1000 ? 3 : 4;
    var W = Math.ceil(innerWidth / S), H = Math.ceil(innerHeight / S), c = PX.canvas(cv, W, H);
    var g = Math.round(H * 0.75), R = PX.R;
    PX.sky(c, W, 0, g, ["#6cc4ff", "#82cfff", "#98d9ff", "#addfff", "#c3e8ff"]);
    PX.cloud(c, Math.round(W * .07), Math.round(g * .38), "mid"); PX.cloud(c, Math.round(W * .8), Math.round(g * .44), "small"); PX.cloud(c, Math.round(W * .85), Math.round(g * .76), "mid");
    PX.hills(c, W, g - 5, 2, 24, 0.4, "#9be07f", "#b6ec98");
    PX.grass(c, 0, g, W, H - g, 7);
    PX.fence(c, 0, W, g - 4);
    /* 5 thứ: chuồng, cây, luống cà rốt, gà, bò */
    var base = H - 4, xs = [0.06, 0.27, 0.47, 0.66, 0.83].map(function (f) { return Math.round(W * f); });
    var small = W < 140;
    PX.barn(c, xs[0], base - 38);
    PX.spr(c, "tree", 32, xs[1], base - 36);
    PX.plot(c, xs[2], base - 18, 26, 16); PX.spr(c, "carrot", 18, xs[2], base - 24); PX.spr(c, "carrot", 18, xs[2] + 9, base - 22);
    if (!small) PX.spr(c, "chicken", 24, xs[3], base - 28);
    PX.spr(c, "cow", 32, small ? xs[3] : xs[4], base - 36);
  }
  function fill() {
    var k = innerWidth < 480 ? 1 : innerWidth < 900 ? 2 : 3;
    document.getElementById("sp1").innerHTML = PX.icon("seedling", 24, k);
    document.getElementById("sp2").innerHTML = PX.icon("seedling", 24, k);
    document.getElementById("sf").innerHTML = PX.icon("sunflower", 24, innerWidth < 640 ? 3 : 4);
    document.getElementById("stIc").innerHTML = PX.icon("star", 14, 2);
  }
  function stars() { if (!u) return; document.getElementById("stars").textContent = FarmCore.stars().balance; }
  PX.loadAtlas().then(function () { setTop(); scene(); fill(); });
  addEventListener("resize", function () { setTop(); scene(); fill(); });
  if (u) { FarmCore.init(u); FarmCore.on(stars); stars(); FarmCore.sync(); }
})();
</script>
</body>
</html>
