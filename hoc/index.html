<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<link rel="icon" href="../assets/pixel/sun.png">
<link rel="stylesheet" href="../assets/pixel/pixel.css">

<style>
:root{color-scheme:light;--col:100vw;--grass:#8fd46c;--wood:#c98c4c;--wood-d:#8f5a2c}
html{scroll-behavior:auto}
body{background:#4f9a40;background-image:linear-gradient(90deg,rgba(0,0,0,.06) 50%,transparent 50%),linear-gradient(rgba(0,0,0,.05) 50%,transparent 50%);background-size:16px 16px;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
img{-webkit-user-drag:none;user-select:none}

/* đầu trang */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 10px;background:#fff4d8;box-shadow:0 4px 0 var(--ink),0 8px 0 rgba(46,34,56,.25)}
.top > *{flex:none}
.ib{width:48px;height:48px;display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:28px;line-height:1;cursor:pointer;border:0;padding:0}
.ib svg{width:26px;height:26px}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1}
.ttl b{font-weight:400;font-size:clamp(26px,6.4vw,32px);letter-spacing:.08em;color:var(--green-d)}
.ttl .bar{margin-top:5px;width:min(220px,100%);height:14px;background:#e8dcc0;box-shadow:0 0 0 2px var(--ink);position:relative}
.ttl .bar i{position:absolute;inset:0 auto 0 0;background:var(--orange);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.ttl .bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;line-height:1;color:var(--ink)}
.kid{height:48px;max-width:34vw;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;border:0;cursor:pointer;font-size:20px}
.kid img{height:30px;width:auto}
.kid b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.kid b{display:none}.kid{padding:0 6px}}
.tmode{position:sticky;top:70px;z-index:19;margin:0 auto;width:var(--col);background:var(--blue-d);color:#fff;text-align:center;font-size:20px;padding:2px 8px}
.tmode a{color:#ffd43b}

/* bản đồ */
.map{width:100%;margin:0 auto;position:relative;--s:2.44}
.scene{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.unit,.cap{position:relative}

/* biển tên Unit */
.ubar{position:absolute;left:max(10px,calc(50% - 300px));right:max(10px,calc(50% - 300px));top:10px;z-index:3;display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;background:#fff4d8}
.ubar .un{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:2px 6px 4px;background:var(--uc);color:#fff;line-height:.85;font-size:16px;text-shadow:2px 2px 0 rgba(0,0,0,.3);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.ubar .un b{font-family:'Silkscreen','VT323',monospace;font-size:30px;line-height:1}
.ubar .ut{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1}
.ubar .ut b{font-weight:400;font-size:clamp(22px,5.6vw,28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubar .ut small{font-size:18px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubar .ut .zh{font-size:15px}
.ubar .up{flex:none;display:flex;align-items:center;gap:2px;font-size:22px}
.unit.locked .ubar{background:#e7e1d6}
.unit.locked .ubar .un{background:#9d958b}
.c0{--uc:#e9771a}.c1{--uc:#2b7fd0}.c2{--uc:#d63c65}.c3{--uc:#7d4fd0}

/* chặng */
.stop{position:absolute;z-index:4;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.node{position:relative;width:clamp(58px,calc(var(--s) * 29px),104px);aspect-ratio:1;border:0;padding:0;cursor:pointer;background:var(--ink);
  --cp:polygon(30% 0,70% 0,70% 5%,85% 5%,85% 15%,95% 15%,95% 30%,100% 30%,100% 70%,95% 70%,95% 85%,85% 85%,85% 95%,70% 95%,70% 100%,30% 100%,30% 95%,15% 95%,15% 85%,5% 85%,5% 70%,0 70%,0 30%,5% 30%,5% 15%,15% 15%,15% 5%,30% 5%);
  clip-path:var(--cp);-webkit-clip-path:var(--cp);transition:transform .1s}
.node:active{transform:translateY(3px)}
.node .f{position:absolute;inset:5px;clip-path:var(--cp);-webkit-clip-path:var(--cp);background:var(--nc,#c9c3bb);display:grid;place-items:center;
  box-shadow:inset 0 6px 0 rgba(255,255,255,.4),inset 0 -8px 0 rgba(0,0,0,.2)}
.node .num{font-family:'Silkscreen','VT323',monospace;font-size:clamp(28px,8vw,36px);line-height:1;color:#fff;text-shadow:3px 3px 0 rgba(46,34,56,.55)}
.node .mini{position:absolute;right:16%;bottom:12%;font-family:'Silkscreen',monospace;font-size:15px;color:var(--ink);line-height:1}
.stop.locked .node{--nc:#cfc8bd}
.stop.locked .num{color:#8f877d;text-shadow:none}
.stop.open .node{--nc:var(--green)}
.stop.cur .node{--nc:var(--orange)}
.stop.w.open .node{--nc:var(--blue)}
.sh-ic{flex:none;width:84px;height:84px;display:grid;place-items:center;margin-top:-6px;background:var(--blue);box-shadow:0 0 0 3px var(--ink)}
.sh-ic .note{width:60px;height:60px}
.node .note{width:62%;height:62%}
.ic-note{flex:none;width:40px;height:40px;display:grid;place-items:center}.ic-note .note{width:36px;height:36px}
.stop.done .node{--nc:var(--yellow)}
.tag{font-size:clamp(19px,calc(var(--s) * 7.4px),26px);line-height:1;padding:2px 8px 3px;background:#fff4d8;color:var(--ink);white-space:nowrap;box-shadow:0 -2px 0 var(--ink),0 2px 0 var(--ink),-2px 0 0 var(--ink),2px 0 0 var(--ink),0 5px 0 rgba(46,34,56,.3)}
.stop.locked .tag{background:#e7e1d6;color:#8f877d}
.stop.cur .tag{background:var(--orange);color:#fff}
.stop.cur::before{content:"";position:absolute;left:50%;top:0;width:clamp(58px,calc(var(--s) * 29px),104px);aspect-ratio:1;transform:translateX(-50%);background:rgba(255,212,59,.75);
  clip-path:polygon(30% 0,70% 0,70% 5%,85% 5%,85% 15%,95% 15%,95% 30%,100% 30%,100% 70%,95% 70%,95% 85%,85% 85%,85% 95%,70% 95%,70% 100%,30% 100%,30% 95%,15% 95%,15% 85%,5% 85%,5% 70%,0 70%,0 30%,5% 30%,5% 15%,15% 15%,15% 5%,30% 5%);animation:ring 1.4s steps(6) infinite;z-index:-1}
@keyframes ring{0%{transform:translateX(-50%) scale(1);opacity:.9}100%{transform:translateX(-50%) scale(1.55);opacity:0}}
.bub{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:24px;letter-spacing:.06em;line-height:1;padding:6px 10px;background:#fff;color:var(--orange-d);
  box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink);animation:bob 1s steps(2) infinite;pointer-events:none}
.bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;width:12px;height:9px;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
.shake{animation:shake .4s steps(4)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop .node{animation:pop .7s steps(5)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* nhân vật */
.who{position:absolute;z-index:3;height:clamp(72px,calc(var(--s) * 34px),140px);width:auto;transform:translate(-50%,-58%);pointer-events:none;filter:drop-shadow(0 4px 0 rgba(46,34,56,.3));transition:filter .3s,opacity .3s}
.who.off{filter:grayscale(1) drop-shadow(0 4px 0 rgba(46,34,56,.2));opacity:.55}
.who.hop{animation:hop 1.2s steps(3) infinite}
@keyframes hop{50%{transform:translate(-50%,-64%)}}

/* biển ôn tập, đích, xuất phát */
.sign{position:absolute;left:50%;transform:translateX(-50%);z-index:3;text-align:center;padding:6px 16px 8px;background:var(--wood);color:#fff;line-height:1;white-space:nowrap;
  box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),0 8px 0 rgba(46,34,56,.3),inset 0 -5px 0 var(--wood-d);text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.sign b{display:block;font-weight:400;font-size:clamp(30px,8vw,38px);letter-spacing:.08em}
.sign small{font-size:20px}
.cap .trophy{position:absolute;left:50%;transform:translateX(-50%);z-index:3}

/* nút dưới */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;gap:14px;width:min(calc(100vw - 24px),560px);justify-content:center}
.dock .btn{flex:1;min-width:0;justify-content:center;flex-direction:column;gap:0;line-height:1;padding:8px 10px 10px;font-size:clamp(22px,5.8vw,28px)}
.dock .btn small{font-size:.68em;opacity:.95;white-space:nowrap}
.dock .now{background:var(--orange)}
.dock .rev{background:var(--blue)}
.dock .rev.up{background:var(--green)}

/* thẻ chặng */
.ov{position:fixed;inset:0;z-index:40;background:rgba(46,34,56,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
.sheet{width:min(500px,100%);padding:16px 16px 18px;display:grid;gap:12px;animation:up .25s steps(4)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-h{display:flex;gap:12px;align-items:flex-start}
.sh-h img{height:84px;width:auto;flex:none;margin-top:-34px;filter:drop-shadow(0 4px 0 rgba(46,34,56,.3))}
.sh-h > div{flex:1;min-width:0;display:grid;gap:4px}
.sh-h .chip{justify-self:start;font-size:18px}
.sh-h h3{margin:0;font-weight:400;font-size:30px;line-height:.95}
.sh-h h3 small{display:block;font-size:20px;color:var(--mute);margin-top:3px}
.sh-h p{margin:0;font-size:20px;line-height:1.1;color:var(--ink)}
.x{flex:none;width:40px;height:40px;border:0;background:#e8dcc0;font-family:'Silkscreen',monospace;font-size:20px;cursor:pointer;box-shadow:0 0 0 2px var(--ink)}
.items{display:grid;gap:12px}
.item{justify-content:flex-start;font-size:28px;padding:8px 14px;min-height:60px}
.item .pxi,.item img{flex:none}
.item .t{flex:1;text-align:left;line-height:1}
.item .t small{display:block;font-size:.66em;opacity:.9}
.item.ok{background:#e0a800}
.item .st{font-size:22px;background:rgba(0,0,0,.18);padding:2px 6px}
.note{margin:0;font-size:18px;color:var(--mute);line-height:1.1}
.lockmsg{font-size:24px;line-height:1.1;text-align:center;padding:4px 0}

/* khung mở bài */
.viewer{position:fixed;inset:0;z-index:50;background:#fffaf0;display:grid;grid-template-rows:auto 1fr}
.vbar{display:flex;align-items:center;gap:12px;padding:max(8px,env(safe-area-inset-top)) 12px 10px;background:#fff4d8;box-shadow:0 4px 0 var(--ink)}
.vbar .btn{font-size:24px;padding:4px 14px 6px}
.vtitle{flex:1;min-width:0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newtab{font-size:18px;color:var(--mute);white-space:nowrap}
@media (max-width:460px){.newtab{display:none}}
.viewer iframe{width:100%;height:100%;border:0;display:block;background:#fff;margin-top:4px}

.toast{position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;top:96px;z-index:60;text-align:center;padding:10px 16px;font-size:24px;line-height:1.05;background:#fff4d8}
.toast.win{background:var(--yellow)}
#fx{position:fixed;inset:0;z-index:61;pointer-events:none;width:100%;height:100%}
.foot{width:100%;margin:0 auto;text-align:center;padding:14px 8px 0;font-size:18px;color:#fff}
.foot a{color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
(function(){
"use strict";
const UNITS = window.LC_UNITS || [], P = window.LCPATH, A = window.FARM_ATLAS;
const $ = id => document.getElementById(id);
const WHO = [null,"bunny","leo","xiaobao","buffy"];          // Khởi động không có nhân vật; Bài 1 → 4: Bunny, Leo, Xiaobao, Buffy
const TAG = ["♪ Khởi động","Bài 1 · Từ vựng","Bài 2 · Từ vựng","Bài 3 · Truyện","Bài 4 · Thực hành"];
const TITLE = ["Khởi động","Bài 1 · Từ vựng","Bài 2 · Từ vựng","Bài 3 · Truyện","Bài 4 · Thực hành"];
const SUB = ["Warm-up · hát cùng các bạn","Vocabulary 1","Vocabulary 2","Story","Practice"];
const NS = 5;
const ICON = {"warm-up":"speaker","vocab-1":"books","vocab-2":"books","story":"sparkles","practice":"gift","sat":"glowing_star"};
const H = 264, PTS = [[52,238],[106,194],[54,150],[106,106],[52,62]];   // điện thoại: cột 160 điểm ảnh; máy rộng hơn tính lại trong layout()

/* ---------- hình từ bộ sprite ---------- */
const sheets = {};
function loadSheet(s){ return new Promise(r => { const i = new Image(); i.onload = () => { sheets[s] = i; r(); }; i.onerror = r; i.src = "../nong-trai/img/atlas-" + s + ".png"; }); }
function icon(name, size, k){
  const m = A && A.sizes[size] && A.sizes[size][name]; if(!m) return "";
  const at = sheets[size], w = at ? at.width : 0, h = at ? at.height : 0;
  return '<i class="pxi" style="width:'+m[2]*k+'px;height:'+m[3]*k+'px;background-image:url(../nong-trai/img/atlas-'+size+'.png);background-position:-'+m[0]*k+'px -'+m[1]*k+'px;background-size:'+w*k+'px '+h*k+'px"></i>';
}
function spr(c, name, size, x, y){
  const m = A && A.sizes[size] && A.sizes[size][name], im = sheets[size];
  if(m && im) c.drawImage(im, m[0], m[1], m[2], m[3], Math.round(x - m[2]/2), Math.round(y - m[3]), m[2], m[3]);
}

/* ---------- bố cục: điện thoại giữ cột 160 điểm ảnh; tablet, laptop trải hết bề ngang ---------- */
let L = null;
function layout(){
  const cw = document.documentElement.clientWidth || innerWidth;
  let Wl = 160;
  if(cw >= 600){ const s = Math.min((innerHeight - 170) / H, cw / 160, 3); Wl = Math.max(160, Math.round(cw / Math.max(2.2, s))); }
  const mid = Math.round(Wl / 2), A = Wl <= 160 ? 27 : Math.round(Math.min(27 + (Wl - 160) * 0.15, 48)), wide = Wl >= 300;
  const ys = PTS.map(p => p[1]), xs = [mid - A, mid + A, mid - A, mid + A, mid - A];
  if(Wl === 160){ xs[0] = 52; xs[1] = 106; xs[2] = 54; xs[3] = 106; xs[4] = 52; }
  const wx = xs.map(x => wide ? (x < mid ? x - 62 : x + 62) : (x < mid ? x + 72 : x - 72));
  wx[0] = null;
  return {W: Wl, mid, A, wide, pts: xs.map((x, i) => [x, ys[i]]), whox: wx, s: cw / Wl};
}

/* ---------- vẽ cảnh pixel ---------- */
function rng(s){ return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ctx(cv, w, h){ cv.width = w; cv.height = h; const c = cv.getContext("2d"); c.imageSmoothingEnabled = false; return c; }
function R(c, x, y, w, h, col){ c.fillStyle = col; c.fillRect(x|0, y|0, w|0, h|0); }
function disc(c, x, y, r, col){ c.fillStyle = col; for(let dy = -r; dy <= r; dy++){ const w = Math.floor(Math.sqrt(r*r - dy*dy)); c.fillRect((x|0) - w, (y|0) + dy, 2*w + 1, 1); } }
function oval(c, x, y, a, b, col){ c.fillStyle = col; for(let dy = -b; dy <= b; dy++){ const w = Math.floor(a * Math.sqrt(1 - (dy*dy)/(b*b))); c.fillRect((x|0) - w, (y|0) + dy, 2*w + 1, 1); } }
function grass(c, w, h, seed){
  const r = rng(seed);
  R(c, 0, 0, w, h, "#8fd46c");
  for(let y = 0; y < h; y += 24) R(c, 0, y, w, 12, "#8ad067");
  for(let i = 0; i < w*h/700; i++){ const x = r()*w|0, y = r()*h|0; R(c,x,y+1,1,2,"#6cb850"); R(c,x+1,y,1,3,"#6cb850"); R(c,x+2,y+1,1,2,"#6cb850"); }
  const fl = ["#fff7c2","#ffb3c7","#ffffff"];
  for(let i = 0; i < w*h/3200; i++){ const x = r()*w|0, y = r()*h|0, f = fl[i%3]; R(c,x,y,1,1,f); R(c,x-1,y+1,3,1,f); R(c,x,y+2,1,1,f); R(c,x,y+1,1,1,"#ffc93a"); }
}
function road(c, pts, seed){
  const sm = [];
  for(let i = 1; i < pts.length - 2; i++){
    const [p0,p1,p2,p3] = [pts[i-1],pts[i],pts[i+1],pts[i+2]];
    for(let t = 0; t < 1; t += 0.02){
      const t2 = t*t, t3 = t2*t;
      sm.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
               0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);
    }
  }
  sm.forEach(p => disc(c, p[0], p[1], 10, "#c08a4e"));
  sm.forEach(p => disc(c, p[0], p[1], 8, "#eccb8c"));
  const r = rng(seed + 7);
  sm.forEach((p, i) => { if(i % 5 === 0){ R(c, p[0] + (r()*10 - 5), p[1] + (r()*10 - 5), 2, 1, "#d9b073"); } if(i % 9 === 0) R(c, p[0] + (r()*8 - 4), p[1] + (r()*8 - 4), 1, 1, "#fbe6b8"); });
  return sm;
}
function shadow(c, x, y, w){ R(c, x - w/2, y - 1, w, 2, "rgba(46,90,30,.35)"); R(c, x - w/2 + 2, y + 1, w - 4, 1, "rgba(46,90,30,.25)"); }
function put(c, n, s, x, y){ shadow(c, x, y, s === 32 ? 22 : s === 24 ? 18 : 12); spr(c, n, s, x, y); }

/* đồ trang trí hai bên (chỉ khi màn hình rộng) */
function field(c, x, y, w, h, crop){
  R(c, x - 1, y - 1, w + 2, h + 2, "#7a4a22"); R(c, x, y, w, h, "#a8743f");
  for(let yy = y + 3; yy < y + h - 2; yy += 9){ R(c, x + 2, yy, w - 4, 3, "#8f5f30"); for(let xx = x + 8; xx < x + w - 4; xx += 13) spr(c, crop, 14, xx, yy + 3); }
}
function pond(c, x, y, a, b){
  oval(c, x, y + 2, a + 2, b + 2, "rgba(46,90,30,.3)"); oval(c, x, y, a + 2, b + 2, "#2b6fd6"); oval(c, x, y, a, b, "#4aa8ff");
  R(c, x - a/2, y - 2, a/3, 1, "#8fd0ff"); R(c, x + 2, y + 3, a/4, 1, "#8fd0ff");
}
function fence(c, x, y, w){
  R(c, x, y - 7, w, 2, "#c58a4e"); R(c, x, y - 3, w, 2, "#c58a4e");
  for(let xx = x; xx <= x + w - 2; xx += 7){ R(c, xx - 1, y - 11, 4, 12, "#2e2238"); R(c, xx, y - 10, 2, 10, "#e0a35f"); }
}
function sides(c, U, sm, h, seed){
  const r = rng(seed), mid = L.mid, keep = L.wide ? L.A + 62 + 26 : L.A + 36, zone = mid - keep;
  if(zone < 40) return;
  const busy = [];   // ô đã có đồ: [x0,y0,x1,y1]
  const free = (x0, y0, x1, y1) => !busy.some(b => x0 < b[2] && x1 > b[0] && y0 < b[3] && y1 > b[1]);
  const theme = (U && U.deco) || ["flower","tulip"];
  const crops = ["carrot","cabbage","tomato","corn","pumpkin","potato","strawberry","sunflower"];
  [0, 1].forEach(side => {
    const x0 = side ? mid + keep : 0, x1 = side ? L.W : mid - keep, cx = (x0 + x1) / 2;
    const kind = ((U ? U.n : 0) + side) % 2;
    if(h > 200){
      if(kind === 0){
        const fw = Math.min(64, x1 - x0 - 16), fh = 40, fy = Math.round(h * .32 + r() * 30);
        field(c, cx - fw/2, fy, fw, fh, crops[(seed + side * 3) % crops.length]); fence(c, cx - fw/2 - 4, fy + fh + 12, fw + 8);
        busy.push([cx - fw/2 - 8, fy - 6, cx + fw/2 + 8, fy + fh + 14]);
      }else{
        const a = Math.min(30, (x1 - x0) / 2 - 10), py = Math.round(h * .5 + r() * 30);
        pond(c, cx, py, a, 14); spr(c, "duck", 18, cx - 6, py + 2);
        busy.push([cx - a - 6, py - 20, cx + a + 6, py + 18]);
      }
    }
    const pool = [["tree",32],["tree",32],["tree",32],["tree",32],[theme[0],24],[theme[1],24],["flower",18],["tulip",18],["sunflower",18],["rose",18],["chicken",24],["rabbit",24],["cow",24],["pig",24]];
    let placed = 0, pets = 0;
    for(let t = 0; t < 120 && placed < (h > 200 ? 7 : 3); t++){
      const [n, s] = pool[r() * pool.length | 0], pet = s === 24 && /chicken|rabbit|cow|pig/.test(n);
      if(pet && pets >= 2) continue;
      const x = x0 + 14 + r() * (x1 - x0 - 28), y = 40 + r() * (h - 44);
      if(!free(x - 16, y - 34, x + 16, y + 4)) continue;
      put(c, n, s, x, y); busy.push([x - 16, y - 34, x + 16, y + 4]); placed++; if(pet) pets++;
    }
  });
}
function drawUnit(cv, U){
  const W = L.W, c = ctx(cv, W, H), P5 = L.pts, mid = L.mid;
  grass(c, W, H, U.n * 977);
  const sm = road(c, [[mid,H+24],[mid,H],...P5,[mid,0],[mid,-24]], U.n);
  const d = U.deco || [];
  if(L.wide){
    // cạnh mỗi chặng chỉ để một hình nhỏ; còn lại ra hai bên
    sides(c, U, sm, H, U.n * 31 + 5);
  }else{
    const p = P5;
    if(W === 160) [[p[0][0]+86,254,d[0],24],[p[2][0]-38,164,d[1],24],[p[3][0]+40,120,"tree",32],[p[4][0]-36,76,"tree",32]].forEach(([x,y,n,s]) => { if(n) put(c, n, s, x, y); });
    if(W > 160) sides(c, U, sm, H, U.n * 31 + 5);
  }
}
function drawCap(cv, top){
  const W = L.W, mid = L.mid, h = top ? 150 : 110, c = ctx(cv, W, h);
  if(top){
    grass(c, W, h, 31);
    R(c, 0, 0, W, 64, "#9fdcff"); R(c, 0, 60, W, 4, "#bfe8ff");
    for(let x = 20; x < W; x += 96){ const y = 12 + (x * 7 % 14); R(c,x,y,22,6,"#fff"); R(c,x+4,y-4,12,4,"#fff"); R(c,x-2,y+2,26,3,"#fff"); }
    for(let x = 0; x < W; x += 6){ R(c, x, 62, 4, 4, "#6cb850"); }
    const sm = road(c, [[mid,h+24],[mid,h],[mid,96],[mid,88]], 99);
    disc(c, mid, 90, 14, "#c08a4e"); disc(c, mid, 90, 12, "#eccb8c");
    if(L.wide){ const r = rng(3); for(let x = 16; x < W; x += 34){ if(Math.abs(x - mid) < 70) continue; put(c, r() < .7 ? "tree" : "sunflower", r() < .7 ? 32 : 24, x + r()*8, 104 + r()*36); } }
  }else{
    grass(c, W, h, 57);
    road(c, [[mid,-24],[mid,0],[mid,50],[mid,58]], 5);
    disc(c, mid, 56, 14, "#c08a4e"); disc(c, mid, 56, 12, "#eccb8c");
    put(c, "tree", 32, mid - 49, 96); put(c, "house", 32, mid + 55, 90);
    if(L.wide){ const r = rng(9); for(let x = 16; x < W; x += 34){ if(Math.abs(x - mid) < 90) continue; put(c, r() < .6 ? "tree" : "chicken", r() < .6 ? 32 : 24, x + r()*8, 40 + r()*60); } }
  }
}

  map.appendChild(bot);

function drawCaps(){ drawCap($("finish").querySelector("canvas"), true); drawCap($("start").querySelector("canvas"), false); }
function redrawAll(){ UNITS.forEach(U => drawUnit(BARS[U.n].querySelector("canvas"), U)); drawCaps(); const t = $("finish").querySelector(".trophy"); t.innerHTML = icon("trophy", 32, 3); }
/* nốt nhạc pixel cho chặng Khởi động */
const NOTE = '<svg class="note" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><g fill="#2e2238" transform="translate(1 1)"><path d="M6 2h8v3H8v6H6zM12 5h2v5h-2zM3 11h4v1h1v2H7v1H3v-1H2v-2h1zM9 10h4v1h1v2h-1v1H9v-1H8v-2h1z"/></g><g fill="#fff"><path d="M6 2h8v3H8v6H6zM12 5h2v5h-2zM3 11h4v1h1v2H7v1H3v-1H2v-2h1zM9 10h4v1h1v2h-1v1H9v-1H8v-2h1z"/></g></svg>';
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- tô trạng thái ---------- */
let S = null;
function paint(){
  S = P.status();
  S.units.forEach(u => {
    const sec = BARS[u.n]; if(!sec) return;
    sec.classList.toggle("locked", !u.open);
    const nd = u.stages.slice(1).filter(s => s.done).length;

    u.stages.forEach((st, s) => {
      const el = NODES[u.n + "-" + s], cur = S.cur.u === u.n && S.cur.s === s && !S.cur.all;
      el.className = "stop " + (s === 0 ? "w " : "") + (!st.open ? "locked" : st.done ? "done" : cur ? "cur" : "open");
      const f = el.querySelector(".f");
      f.innerHTML = !st.open ? icon("locked", 24, 1.4) : st.done ? icon("star", 24, 1.5) + '<span class="mini">' + (s || "♪") + '</span>' : s === 0 ? NOTE : '<span class="num">' + s + '</span>';
      let b = el.querySelector(".bub");

/* ---------- chạm vào chặng ---------- */
let toastT = 0;
function toast(t, win){ const e = $("toast"); e.textContent = t; e.className = "toast pxf" + (win ? " win" : ""); e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => e.hidden = true, win ? 3600 : 2600); }
function tap(n, s){
  const u = S.units[n - 1], st = u.stages[s], el = NODES[n + "-" + s];
  if(!st.open){
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    const prev = s > 1 ? "Bài " + (s - 1) + " của Unit " + n : "Unit " + (n - 1);
    toast("🔒 Con học xong " + prev + " trước nhé!");

  }

}
function openSheet(n, s){
  const U = UNITS[n - 1], u = S.units[n - 1], st = U.stages[s];
  const lines = st.lines.filter(Boolean).map(l => /[一-鿿]/.test(l) ? '<span class="zh">' + esc(l) + '</span>' : esc(l)).join("<br>");
  let h = '<div class="sh-h">' + (WHO[s] ? '<img src="../assets/pixel/farmer-' + WHO[s] + '.webp" alt="">' : '<span class="sh-ic">' + NOTE + '</span>') + '<div><span class="chip">UNIT ' + n + ' · ' + (s ? "BÀI " + s : "KHỞI ĐỘNG") + '</span><h3>' + TITLE[s] + '<small>' + SUB[s] + '</small></h3><p>' + lines + '</p></div><button class="x" type="button" data-x aria-label="Đóng">X</button></div><div class="items">';
  st.items.forEach(it => {
    const ok = u.items[it.k];
    h += '<button class="btn item' + (ok ? " ok" : "") + '" type="button" data-go="' + it.k + '">' + (it.k === "warm-up" ? '<span class="ic-note">' + NOTE + '</span>' : icon(ICON[it.k], 24, 1.5)) + '<span class="t">' + it.label + '<small>' + (ok ? "Đã xong · học lại" : "Bấm để vào học") + '</small></span><span class="st">' + (ok ? "✓" : "▶") + '</span></button>';
  });
  h += '</div>';
  const need = s === 0 ? "Không bắt buộc: con hát trước hoặc vào thẳng Bài 1 đều được." : s === 4 ? (n < P.LAST ? "Xong bài này thì mở Unit " + (n + 1) + "." : "Bài cuối của Little Seed!") : "Xong bài này thì mở Bài " + (s + 1) + ".";
  h += '<p class="note">' + (n <= P.OPEN_UPTO ? "Unit ôn tập: con học lại thoải mái. " : need + " ") + (s === 0 ? "Hát hết ít nhất 1 bài là xong chặng." : "Bài tính là xong khi con chơi hết ít nhất 1 trò.") + '</p>';
  const sh = $("sheet"); sh.innerHTML = h;
  sh.onclick = e => {
    if(e.target.closest("[data-x]")) return closeSheet();
    const g = e.target.closest("[data-go]"); if(g){ closeSheet(); go(n, g.dataset.go); }
  };
  $("ov").hidden = false;
  setTimeout(() => { const b = sh.querySelector(".item:not(.ok)") || sh.querySelector(".item"); b && b.focus(); }, 30);
}

$("ov").addEventListener("click", e => { if(e.target === $("ov")) closeSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape"){ if(!$("ov").hidden) closeSheet(); else if(!$("viewer").hidden) closeViewer(); } });

/* ---------- mở bài trong khung ---------- */
const viewer = $("viewer"), frame = $("frame");
function itemOf(n, k){ const U = UNITS[n - 1]; for(const st of U.stages) for(const it of st.items) if(it.k === k) return it; return null; }
function stageIdx(k){ return k === "warm-up" ? 0 : k === "vocab-1" ? 1 : k === "vocab-2" ? 2 : k === "story" ? 3 : 4; }
function go(n, k){ location.hash = "u" + n + "/" + k; }
function full(u){ return new URL(u, location.href).href; }
let before = null;
function route(){
  const m = location.hash.match(/^#u(\d+)\/([a-z0-9-]+)$/), n = m ? +m[1] : 0, k = m ? m[2] : "", it = m && UNITS[n - 1] ? itemOf(n, k) : null;
  if(it && S.units[n - 1].stages[stageIdx(k)].open){
    const key = n + "/" + k;
    if(frame.dataset.k !== key){ frame.contentWindow.location.replace(full(it.url)); frame.dataset.k = key; }
    $("vtitle").textContent = "Unit " + n + " · " + TITLE[stageIdx(k)] + (k === "sat" ? " · Show and Tell" : "");
    $("newtab").href = full(it.url);
    if(!before) before = snapshot();
    viewer.hidden = false; document.body.style.overflow = "hidden";
    if(window.LCMUSIC) LCMUSIC.hold(true);
    try{ const dk = LC.doneKey(n), d = JSON.parse(localStorage.getItem(dk)) || {}; if(!d[k]){ d[k] = true; localStorage.setItem(dk, JSON.stringify(d)); } }catch(e){}
  }else{
    if(m) history.replaceState(null, "", location.pathname + location.search);
    viewer.hidden = true; document.body.style.overflow = "";
    if(window.LCMUSIC) LCMUSIC.hold(false);
    if(frame.dataset.k){ frame.contentWindow.location.replace("about:blank"); frame.dataset.k = ""; }
    if(before){ const b = before; before = null; paint(); celebrate(b); }
  }
}
function closeViewer(){ history.replaceState(null, "", location.pathname + location.search); route(); }
$("back").addEventListener("click", closeViewer);
window.addEventListener("hashchange", route);

/* ---------- mở khóa: chúc mừng ---------- */
function snapshot(){ const o = {}; P.status().units.forEach(u => u.stages.forEach((st, s) => { o[u.n + "-" + s] = [st.open, st.done]; })); return o; }
function seenKey(){ const u = LC.user(); return "lc-path-seen:" + (u ? u.id : ""); }
function celebrate(b){
  const now = snapshot(); let fresh = null, done = null;
  for(const k in now){ if(now[k][1] && !(b[k] && b[k][1])) done = done || k; if(now[k][0] && !(b[k] && b[k][0])) fresh = fresh || k; }
  try{ localStorage.setItem(seenKey(), JSON.stringify(now)); }catch(e){}
  if(!done && !fresh) return;
  confetti();
  if(fresh){
    const [n, s] = fresh.split("-").map(Number), el = NODES[fresh];
    toast("🎉 Giỏi quá! Đã mở " + (s <= 1 ? "Unit " + n : "Bài " + s) + "! 太棒了！", true);
    el.classList.add("pop"); setTimeout(() => el.classList.remove("pop"), 900);
    setTimeout(() => scrollToNode(el, true), 400);
  }else toast("⭐ Xong rồi! Con giỏi quá!", true);
}
function checkSeen(){
  let old = null; try{ old = JSON.parse(localStorage.getItem(seenKey())); }catch(e){}
  if(old) celebrate(old); else try{ localStorage.setItem(seenKey(), JSON.stringify(snapshot())); }catch(e){}
}

/* ---------- pháo giấy pixel ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("fx"), c = cv.getContext("2d"), dpr = 1; cv.width = innerWidth; cv.height = innerHeight;
  const col = ["#ffd43b","#ff9f3a","#4dbb5a","#4aa8ff","#ef5b5b","#c77dff"];
  const ps = Array.from({length: 90}, () => ({x: innerWidth/2 + (Math.random()-.5)*120, y: innerHeight*.35, vx: (Math.random()-.5)*12, vy: -Math.random()*12 - 4, s: 6 + (Math.random()*2|0)*4, c: col[Math.random()*col.length|0]}));
  let f = 0;
  (function step(){
    c.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; c.fillStyle = p.c; c.fillRect(p.x|0, p.y|0, p.s, p.s); });
    if(++f < 110) requestAnimationFrame(step); else c.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* ---------- cuộn ---------- */
function scrollToNode(el, smooth){
  const r = el.getBoundingClientRect(), y = scrollY + r.top + r.height/2 - innerHeight * 0.52;
  scrollTo({top: Math.max(0, y), behavior: smooth ? "smooth" : "auto"});
}

  const need = scrollY + r.bottom + 40 - (innerHeight - dock);   // chặng hiện tại phải nằm trên hai nút dưới
  scrollTo({top: Math.max(0, Math.max(Math.min(top, scrollY + r.top - hd - 60), need)), behavior: smooth ? "smooth" : "auto"});
}
